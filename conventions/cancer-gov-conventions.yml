provider: Cancer.gov
providerId: cancer-gov
source: Derived from the eight first-party OpenAPI documents in openapi/_original/ and the live GDC GraphQL
  schema, cross-checked against https://docs.gdc.cancer.gov/API/Users_Guide/Getting_Started/, https://api.seer.cancer.gov/docs
  and https://api.seer.cancer.gov/terms.
overview: Cancer.gov is not one API with one set of conventions — it is six independently built and independently
  operated NCI programs (Clinical Trials Search, GDC, SEER, EVS, MoDaC, and the five webapis.cancer.gov
  content services) that share a domain and nothing else. Auth header, pagination parameter names, error
  envelope and versioning scheme all differ per service, and an integrator has to learn each one separately.
auth:
  style: api-key-header, and it is a different header on every service
  schemes:
  - api: cancer-gov:clinical-trials-api
    header: X-API-KEY
    required: true
    evidence: Live GET https://clinicaltrialsapi.cancer.gov/api/v2/trials without a key returns HTTP 401.
  - api: cancer-gov:seer-api
    header: X-SEERAPI-Key
    required: true
    evidence: components.securitySchemes.apiKeyScheme in https://api.seer.cancer.gov/v3/api-docs; live
      GET /rest/glossary/latest returns HTTP 401 anonymously.
  - api: cancer-gov:gdc-api
    header: X-Auth-Token
    required: false
    evidence: https://docs.gdc.cancer.gov/API/Users_Guide/Getting_Started/ — required only for controlled-access
      data and submission; open data and GraphQL introspection answer anonymously.
  - api: cancer-gov:evs-api
    header: null
    required: false
    evidence: No securityScheme in the spec; live GET https://api-evsrest.nci.nih.gov/api/v1/metadata/terminologies
      returns HTTP 200 anonymously.
  - api: cancer-gov:glossary-api
    header: null
    required: false
    evidence: No securityScheme in any of the five webapis.cancer.gov specs; the same is true for drug-dictionary,
      sitewide-search, best-bets and r4r.
  cross_link: authentication/cancer-gov-authentication.yml
idempotency:
