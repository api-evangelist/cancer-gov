field_expansion:
  supported: true
  note: The Clinical Trials Search API documents include/exclude query parameters for sparse fieldsets.
    The GDC exposes the equivalent through GraphQL field selection at https://api.gdc.cancer.gov/v0/graphql.
    The other services offer no projection controls.
