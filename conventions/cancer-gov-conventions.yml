reversibility:
  grade: none
  supported: false
  note: 'There is a real write surface — 84 mutating operations — and not one reversal path. The destructive
    operations are plain deletes with no soft-delete, no restore and no stated recovery window: SEER exposes
    DELETE /rest/staging/{algorithm}, DELETE /rest/hcpcs/code/{code}, DELETE /rest/rx/{version}/delete/{id},
    DELETE /rest/disease/{version}/delete/{id} and DELETE /rest/glossary/{version}/delete/{id}; MoDaC
    exposes POST /deleteCollection, POST /delete/datafile and POST /deletePredictions. MoDaC''s retryUpload
    and retryDownload are retry operations on a transfer task, not reversals of a completed write. No
    documentation states any window in which a delete can be undone, so no window is recorded here.'
  surfaces:
  - api: cancer-gov:seer-api
    write_operations: 53
    reversal_operation: null
    window: null
  - api: cancer-gov:modac-api
    write_operations: 29
    reversal_operation: null
    window: null
  - api: cancer-gov:evs-api
    write_operations: 2
    reversal_operation: null
    window: null
  - api: cancer-gov:gdc-api
    write_operations: null
    reversal_operation: null
    window: null
    note: GDC submission is a write surface but publishes no OpenAPI, so its operation count cannot be
      derived.
dry_run_mode:
  supported: false
  note: No operation declares a dry-run, validate-only or preview mode in any of the eight specs.
