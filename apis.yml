- aid: cancer-gov:gdc-api
  name: NCI Genomic Data Commons (GDC) API
  description: The external-facing REST interface for the NCI Genomic Data Commons. Drives the GDC Data
    Portal and GDC Submission Portal and is open for programmatic access. Provides query, download, and
    submission endpoints for cancer genomics datasets including TCGA, TARGET, CPTAC, and other NCI-funded
    genomic programs.
  humanURL: https://gdc.cancer.gov/developers/gdc-application-programming-interface-api
