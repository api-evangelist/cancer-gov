- aid: cancer-gov:glossary-api
  name: NCI Glossary Term API
  description: Serves the NCI Dictionary of Cancer Terms — the authoritative plain-language and health-professional
    definitions used across cancer.gov and by the NCI Dictionary Widget. Supports autosuggest, full-text
    search, alphabetical expansion and per-term retrieval by id or pretty URL name, in English and Spanish,
    for both Patient and HealthProfessional audiences. No credential required.
  humanURL: https://webapis.cancer.gov/glossary/v1/
  baseURL: https://webapis.cancer.gov/glossary/v1
  tags:
