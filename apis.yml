description: Cancer.gov is the web presence of the National Cancer Institute (NCI), the U.S. federal government's
  principal agency for cancer research and training. NCI and its partner programs expose a rich set of
  open APIs covering cancer clinical trials, genomic data, cancer-incidence surveillance, research data
  and models, terminology and vocabularies, and PDQ content — giving researchers, advocacy groups, clinicians,
  and application developers programmatic access to authoritative cancer data and content.
apis:
- aid: cancer-gov:clinical-trials-api
  name: NCI Clinical Trials Search API
  description: >-
    RESTful API that lets developers build applications, search tools, and digital platforms over NCI-supported
    cancer clinical trials data sourced from NCI's Clinical Trials Reporting Program (CTRP). The same
    API powers NCI's public Clinical Trials Search. Developers register for a free API key through the
    CTS Developer Accounts portal.
  humanURL: https://clinicaltrialsapi.cancer.gov/
  baseURL: https://clinicaltrialsapi.cancer.gov/api/v2
  tags:
  - Clinical Trials
  - CTRP
  - Research
  properties:
  - type: Documentation
    url: https://clinicaltrialsapi.cancer.gov/
  - type: Signup
    url: https://clinicaltrialsapi.cancer.gov/
  - type: ParentPage
    url: https://www.cancer.gov/syndication/api
  - type: Support
    url: mailto:ctrp_support@mail.nih.gov
  - type: SDKs
    url: packages/cancer-gov-packages.yml
- aid: cancer-gov:gdc-api
  name: NCI Genomic Data Commons (GDC) API
  description: >-
    The external-facing REST interface for the NCI Genomic Data Commons. Drives the GDC Data Portal and
    GDC Submission Portal and is open for programmatic access. Provides query, download, and submission
    endpoints for cancer genomics datasets including TCGA, TARGET, CPTAC, and other NCI-funded genomic
    programs.
  humanURL: https://gdc.cancer.gov/developers/gdc-application-programming-interface-api
  baseURL: https://api.gdc.cancer.gov
  tags:
  - Genomics
  - TCGA
  - Research Data
