description: Cancer.gov is the web presence of the National Cancer Institute (NCI), the U.S. federal government's
  principal agency for cancer research and training. NCI and its partner programs expose a rich set of
  open APIs covering cancer clinical trials, genomic data, cancer-incidence surveillance, research data
  and models, terminology and vocabularies, and PDQ content — giving researchers, advocacy groups, clinicians,
  and application developers programmatic access to authoritative cancer data and content.
apis:
- aid: cancer-gov:clinical-trials-api
  name: NCI Clinical Trials Search API
  description: RESTful API that lets developers build applications, search tools, and digital platforms
    over NCI-supported cancer clinical trials data sourced from NCI's Clinical Trials Reporting Program
    (CTRP). The same API powers NCI's public Clinical Trials Search. Developers register for a free API
    key through the CTS Developer Accounts portal.
  humanURL: https://clinicaltrialsapi.cancer.gov/
  baseURL: https://clinicaltrialsapi.cancer.gov/api/v2
  tags:
  - Clinical Trials
  - CTRP
  - Research
