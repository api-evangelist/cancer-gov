- aid: cancer-gov:evs-api
  name: NCI EVS Terminology API
  description: Enterprise Vocabulary Services (EVS) exposes NCI Thesaurus and NCI Metathesaurus content
    — over 192,000 concepts, 154,000 textual definitions, 623,000 synonyms and 630,000 inter-concept relationships
    — through a search and browse API used to code, analyze, and share cancer and biomedical research
    information.
