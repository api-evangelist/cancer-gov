- aid: cancer-gov:drug-dictionary-api
  name: NCI Drug Dictionary API
  description: Serves the NCI Drug Dictionary — definitions of drugs and drug combinations used in cancer
    treatment and prevention, matched across generic names, brand names and code names. Supports autosuggest,
    search, alphabetical expansion and retrieval by id or pretty URL name. No credential required.
  humanURL: https://webapis.cancer.gov/drugdictionary/v1/
