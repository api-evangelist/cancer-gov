openapi: 3.2.0
info:
  title: NCI EVS Rest Concept endpoints API
  description: Endpoints to support searching, metadata, and content retrieval for EVS terminologies. To learn more about how to interact with this api, see the Github evsrestapi-client-SDK project.
  termsOfService: https://evs.nci.nih.gov/ftp1/NCI_Thesaurus/ThesaurusTermsofUse.htm
  contact:
    name: NCI EVS
    email: NCIAppSupport@nih.gov
  version: 2.4.1.RELEASE
servers:
- url: /
tags:
- name: Concept endpoints
paths:
  /api/v1/concept/{terminology}:
    get:
      tags:
      - Concept endpoints
      summary: Get concepts specified by list parameter
      operationId: getConcepts
      parameters:
      - name: terminology
        in: path
        description: Terminology, e.g. 'ncit' or 'ncim' (<a href="https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/TERMINOLOGIES.md" target="_blank">See here for complete list</a>)
        required: true
        schema:
          type: string
        example: ncit
      - name: include
        in: query
        description: 'Indicator of how much data to return. Comma-separated list of any of the following values: minimal, summary, full, associations, children, definitions, disjointWith, history, inverseAssociations, inverseRoles, maps, parents, properties, roles, synonyms. <a href=''https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/INCLUDE.md'' target=''_blank''>See here for detailed information</a>.'
        required: false
        schema:
          type: string
        example: minimal
      - name: list
        in: query
        description: List (comma-separated) of codes to return concepts for, e.g.<ul><li>'C2291,C3224' for <i>ncit</i></li><li>'C0010137,C0025202' for <i>ncim</i></li></ul>
        required: true
        schema:
          type: string
      - name: X-EVSRESTAPI-License-Key
        in: header
        description: Required license information for restricted terminologies. <a href='https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/LICENSE.md' target='_blank'>See here for detailed information</a>.
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '417':
          description: Expectation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '200':
          description: Successfully retrieved the requested information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concept'
  /api/v1/concept/{terminology}/{code}:
    get:
      tags:
      - Concept endpoints
      summary: Get the concept for the specified terminology and code
      operationId: getConcept
      parameters:
      - name: terminology
        in: path
        description: Terminology, e.g. 'ncit' or 'ncim' (<a href="https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/TERMINOLOGIES.md" target="_blank">See here for complete list</a>)
        required: true
        schema:
          type: string
        example: ncit
      - name: code
        in: path
        description: Code in the specified terminology, e.g.<ul><li>'C3224' for <i>ncit</i></li><li>'C0025202' for <i>ncim</i></li></ul>
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: If set to an integer (between <i>1</i> and <i>100</i>), elements of the concept should be limited to that specified number of entries. Thus a user interface can quickly retrieve initial data for a concept (even with <i>include=full</i>) and then call back for more data. An extra placeholder entry with just a <i>ct</i> field will be included to indicate the total count.
        required: false
        schema:
          type: integer
          format: int32
        example: 100
      - name: include
        in: query
        description: 'Indicator of how much data to return. Comma-separated list of any of the following values: minimal, summary, full, associations, children, definitions, disjointWith, history, inverseAssociations, inverseRoles, maps, parents, properties, roles, synonyms. <a href=''https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/INCLUDE.md'' target=''_blank''>See here for detailed information</a>.'
        required: false
        schema:
          type: string
        example: summary
      - name: X-EVSRESTAPI-License-Key
        in: header
        description: Required license information for restricted terminologies. <a href='https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/LICENSE.md' target='_blank'>See here for detailed information</a>.
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '417':
          description: Expectation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '200':
          description: Successfully retrieved the requested information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concept'
  /api/v1/concept/{terminology}/{code}/subtree:
    get:
      tags:
      - Concept endpoints
      summary: Get the entire subtree from the root node to the specified code
      operationId: getSubtree
      parameters:
      - name: terminology
        in: path
        description: Terminology, e.g. 'ncit'
        required: true
        schema:
          type: string
        example: ncit
      - name: code
        in: path
        description: Code in the specified terminology, e.g. 'C3224' for <i>ncit</i>. This call is only meaningful for <i>ncit</i>.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: If set to an integer (between <i>1</i> and <i>100</i>), subtrees and siblings at each level will be limited to the specified number of entries. Thus a user interface can quickly retrieve initial data for a subtree and then call back for more data. An extra placeholder entry with just a <i>ct</i> field will be included to indicate the total count.
        required: false
        schema:
          type: integer
          format: int32
        example: 100
      - name: X-EVSRESTAPI-License-Key
        in: header
        description: Required license information for restricted terminologies. <a href='https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/LICENSE.md' target='_blank'>See here for detailed information</a>.
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '200':
          description: Successfully retrieved the requested information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HierarchyNode'
