      summary: Get default prefixes used by SPARQL queries
      operationId: getSparqlPrefixes
      parameters:
      - name: terminology
        in: path
        description: Single terminology to find prefixes for, e.g. 'ncit' or 'hgnc' (<a href="https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/TERMINOLOGIES.md">See here for complete list</a>)
        required: true
        schema:
          type: string
        example: ncit
      responses:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestException'
        '417':
