                $ref: '#/components/schemas/GlossaryTerm'
    servers:
    - url: /glossary/v1
  /Terms/{dictionary}/{audience}/{language}:
    get:
      tags:
      - Terms
      summary: Retrieves a portion of the overall set of glossary terms for a given…
      operationId: Terms_GetAll
      parameters:
      - name: dictionary
        in: path
        required: true
        description: "The dictionary to use. Valid values are \"cancer.gov\" for the Dictionary of Cancer Terms\n            and \"genetics\" for the Dictionary of Genetics Terms."
        schema:
          type: string
        x-position: 1
      - name: audience
        in: path
        required: true
        description: The target audience.
        schema:
          $ref: '#/components/schemas/AudienceType'
        x-position: 2
      - name: language
        in: path
        required: true
        description: Language (English - en; Spanish - es).
        schema:
          type: string
        x-position: 3
      - name: size
        in: query
        description: The number of records to retrieve.
        schema:
          type: integer
          format: int32
          default: 100
        x-position: 4
      - name: from
        in: query
        description: The offset into the overall set to use for the first record.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 5
      - name: includeAdditionalInfo
        in: query
        description: If true, the RelatedResources and Media fields will be populated. Else, they will be empty.
        schema:
          type: boolean
          default: false
        x-position: 6
      responses:
        '200':
          description: A GlossaryTermResults object containing the desired records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTermResults'
    servers:
    - url: /glossary/v1
  /Terms/search/{dictionary}/{audience}/{language}/{query}:
    get:
      tags:
      - Terms
      summary: Search for Terms based on search criteria
      operationId: Terms_Search
      parameters:
      - name: dictionary
        in: path
        required: true
        description: The specific dictionary to retrieve from.
        schema:
          type: string
        x-position: 1
      - name: audience
        in: path
        required: true
        description: The target audience.
        schema:
          $ref: '#/components/schemas/AudienceType'
        x-position: 2
      - name: language
        in: path
        required: true
        description: Language (English - en; Spanish - es).
        schema:
          type: string
        x-position: 3
      - name: query
        in: path
        required: true
        description: The string to search for.
        schema:
          type: string
        x-position: 4
      - name: matchType
        in: query
        description: "Should the search match items beginning with the search text (Begins),\n            containing it (Contains), or an exact match (Exact)?"
        schema:
          default: Begins
          oneOf:
          - $ref: '#/components/schemas/MatchType'
        x-position: 5
      - name: size
        in: query
        description: The number of records to retrieve.
        schema:
          type: integer
          format: int32
          default: 100
        x-position: 6
      - name: from
        in: query
        description: The offset into the overall set to use for the first record.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 7
      - name: includeAdditionalInfo
        in: query
        description: If true, the RelatedResources and Media fields will be populated. Else, they will be empty.
