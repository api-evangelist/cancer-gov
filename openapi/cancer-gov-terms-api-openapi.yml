    get:
      tags:
      - Terms
      summary: Retrieve the details of a Glossary Term by ID value
      operationId: Terms_GetById
      parameters:
      - name: dictionary
        in: path
        required: true
        description: "The dictionary to use. Valid values are \"cancer.gov\" for the Dictionary of Cancer Terms\n            and \"genetics\" for the Dictionary of Genetics Terms."
        schema:
          type: string
        x-position: 1
      - name: audience
        in: path
        required: true
        description: The intended audience.
        schema:
          $ref: '#/components/schemas/AudienceType'
        x-position: 2
      - name: language
        in: path
        required: true
        description: The language in which to fetch the details. Valid values are "en" for English and "es" for Spanish.
        schema:
          type: string
        x-position: 3
      - name: id
        in: path
        required: true
        description: The term's ID
        schema:
          type: integer
          format: int64
        x-position: 4
      - name: useFallback
        in: query
        description: Set true to use falback logic if the term isn't available for the specified combination of audience and dictionary.
        schema:
          type: boolean
          default: false
        x-position: 5
      responses:
        '200':
          description: GlossaryTerm object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
    servers:
    - url: /glossary/v1
  /Terms/{dictionary}/{audience}/{language}/{prettyUrlName}:
