  /api/v1/metadata/{terminology}/subset/{code}:
    get:
      tags:
      - Metadata endpoints
      summary: Get the subset for the specified terminology and code
      description: This endpoint will be deprecated in v2 in favor of top level subset endpoints.
      operationId: getSubset_1
      parameters:
      - name: terminology
        in: path
        description: Terminology, e.g. 'ncit'.
        required: true
        schema:
          type: string
        example: ncit
      - name: code
        in: path
        description: Subset code, e.g. 'C116978' for <i>ncit</i>. This call is only meaningful for <i>ncit</i>.
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Indicator of how much data tc return. Comma-separated list of any of the following values: minimal, summary, full, associations, children, definitions, disjointWith, inverseAssociations, inverseRoles, maps, parents, properties, roles, synonyms. <a href=''https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/INCLUDE.md'' target=''_blank''>See here for detailed information</a>.'
        required: false
        schema:
          type: string
