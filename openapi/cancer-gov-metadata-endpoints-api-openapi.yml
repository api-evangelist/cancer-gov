  /api/v1/metadata/{terminology}/subsets:
    get:
      tags:
      - Metadata endpoints
      summary: Get all subsets (or those specified by list parameter) for the specified…
      description: This endpoint will be deprecated in v2 in favor of top level subset endpoints.
      operationId: getSubsets_1
      parameters:
      - name: terminology
        in: path
        description: Terminology, e.g. 'ncit'.  This call is only meaningful for <i>ncit</i>.
        required: true
        schema:
          type: string
        example: ncit
      - name: include
        in: query
        description: 'Indicator of how much data to return. Comma-separated list of any of the following values: minimal, summary, full, associations, children, definitions, disjointWith, inverseAssociations, inverseRoles, maps, parents, properties, roles, synonyms. <a href=''https://github.com/NCIEVS/evsrestapi-client-SDK/blob/main/doc/INCLUDE.md'' target=''_blank''>See here for detailed information</a>.'
        required: false
        schema:
          type: string
        example: minimal
      - name: list
        in: query
        description: List of codes or labels to return subsets for (or leave blank for all).  If invalid values are passed, the result will simply include no entries for those invalid values.
        required: false
        schema:
          type: string
      responses:
        '417':
          description: Expectation failed
          content:
            application/json:
