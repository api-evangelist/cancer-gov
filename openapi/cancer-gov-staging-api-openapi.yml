          type: string
        name:
          type: string
        description:
          type: string
        naaccr_item:
          type: integer
          format: int32
        naaccr_xml_id:
          type: string
        table:
          type: string
        default:
          type: string
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/StagingMetadata'
    Metadata:
      type: object
