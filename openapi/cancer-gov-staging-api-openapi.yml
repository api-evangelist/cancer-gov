          - UNKNOWN_INPUT
          - INVALID_REQUIRED_INPUT
          - INVALID_NON_REQUIRED_INPUT
          - UNKNOWN_INPUT_MAPPING
          - STAGING_ERROR
          - MATCH_NOT_FOUND
          - UNKNOWN_TABLE
          - INFINITE_LOOP
          - INVALID_OUTPUT
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        key:
          type: string
        message:
          type: string
    Input:
      type: object
      properties:
